[project]
name = "document-mcp-server"
version = "0.1.0"
description = "MCP server for document reading, searching, and listing (TXT, MD, PDF, DOCX)"
readme = "README.md"
authors = [
    { name = "Makeshkumar M", email = "152783179+Makeshkumar103@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "mcp[cli]>=2.3.0",
    "pypdf>=6.19.0",
]

[project.scripts]
document-mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
